# Comparison tooling (P4 example / Retail default): build the example Parser on Windows and verify all three authoring interfaces.
name: Phase interface examples

on:
  push:
    branches: ['**']
    paths:
      - '.contrib/src/Parser/**'
      - '.contrib/phase-examples/**'
      - '!.contrib/phase-examples/generated/**'
      - '.github/workflows/PhaseExamples.yml'
  pull_request:
    paths:
      - '.contrib/src/Parser/**'
      - '.contrib/phase-examples/**'
      - '.github/workflows/PhaseExamples.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-examples:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the Release x64 Parser
        run: |
          dotnet build .contrib/src/Parser/Parser.csproj -c Release -p:Platform=x64 "-p:OutputPath=$env:RUNNER_TEMP/phase-parser"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Check existing Parser cost merging
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .contrib/src/Parser/tests/CostMerge.Tests.ps1 -ParserPath "$env:RUNNER_TEMP/phase-parser/Parser.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Check Parser localization fallback
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .contrib/src/Parser/tests/LocalizationFallback.Tests.ps1 -ParserPath "$env:RUNNER_TEMP/phase-parser/Parser.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build Lua 5.1.5 for the example checks
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'lua-5.1.5.tar.gz'
          curl.exe --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 60 --retry-max-time 180 https://www.lua.org/ftp/lua-5.1.5.tar.gz --output $archive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $expected = '2640fc56a795f29d28ef15e13c34a47e223960b0240e8cb0a82d9b0738695333'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) { throw 'Unexpected Lua source digest' }
          tar.exe -xzf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $src = Join-Path $env:RUNNER_TEMP 'lua-5.1.5/src'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vcvars = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if (!$vcvars) { throw 'MSVC x64 tools are required' }
          $sources = ((Get-ChildItem "$src/*.c" -Name | Where-Object { $_ -notin @('luac.c', 'print.c') }) -join ' ')
          $batch = Join-Path $env:RUNNER_TEMP 'build-phase-lua.cmd'
          @('@echo off', "call `"$vcvars`" >nul || exit /b 1", "cd /d `"$src`" || exit /b 1", "cl /nologo /O2 /D_CRT_SECURE_NO_WARNINGS /Felua51.exe $sources", 'exit /b %errorlevel%') | Set-Content $batch -Encoding ascii
          & $batch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Check generated phase inputs against the authored schedule
        run: python .contrib/phase-examples/prepare.py --check

      - name: Compare Blackwing Lair migration snapshots with the built Parser
        run: |
          python .contrib/phase-examples/evolution/blackwing-lair/verify.py --parser "$env:RUNNER_TEMP/phase-parser/Parser.exe" --lua "$env:RUNNER_TEMP/lua-5.1.5/src/lua51.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Check six complete source migration snapshots
        run: |
          python .contrib/phase-examples/evolution/full-source/verify.py --lua "$env:RUNNER_TEMP/lua-5.1.5/src/lua51.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Check current standalone BWL owners with the built Parser
        run: |
          python .contrib/phase-examples/evolution/full-source/verify_current_parser.py --parser "$env:RUNNER_TEMP/phase-parser/Parser.exe" --lua "$env:RUNNER_TEMP/lua-5.1.5/src/lua51.exe" --output "$env:RUNNER_TEMP/phase-examples-result/current-source"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Verify all authoring options with the built Parser
        run: |
          python .contrib/phase-examples/verify.py --parser "$env:RUNNER_TEMP/phase-parser/Parser.exe" --lua "$env:RUNNER_TEMP/lua-5.1.5/src/lua51.exe" --output "$env:RUNNER_TEMP/phase-examples-result/generated"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python .contrib/phase-examples/verify_compact.py --parser "$env:RUNNER_TEMP/phase-parser/Parser.exe" --lua "$env:RUNNER_TEMP/lua-5.1.5/src/lua51.exe" --baseline-output "$env:RUNNER_TEMP/phase-examples-result/generated"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bundle = Join-Path $env:RUNNER_TEMP 'phase-examples-result'
          Copy-Item "$env:RUNNER_TEMP/phase-parser/Parser.exe" $bundle
          [ordered]@{
            '$comment' = 'Generated by Windows CI for the P4 example and Retail default. Parser.exe is a shared build tool. Check its bytes against parserSHA256.'
            sourceCommit = (git rev-parse HEAD).Trim()
            run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            platform = 'Windows x64 / net481 / Release'
            parserSHA256 = (Get-FileHash "$bundle/Parser.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
            verifierLua = '5.1.5'
          } | ConvertTo-Json | Set-Content "$bundle/build.json" -Encoding utf8
          Get-Content "$bundle/build.json"

      - uses: actions/upload-artifact@v7
        with:
          name: phase-examples-windows
          path: ${{ runner.temp }}/phase-examples-result
          if-no-files-found: error
