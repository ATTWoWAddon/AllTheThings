      - name: Check Standard addon helper
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: pwsh
        run: |
          & ./.github/scripts/Check-EditorConfig.ps1 -Group standard-addon -VerboseChecker

      - name: Check raw ItemDB inputs
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: pwsh
        run: |
          & ./.github/scripts/Check-EditorConfig.ps1 -Group raw-itemdb -VerboseChecker

      - name: Check Forever database Lua
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: pwsh
        run: |
          & ./.github/scripts/Check-EditorConfig.ps1 -Group forever-database -VerboseChecker

      - name: Check Season of Discovery database Lua
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: pwsh
        run: |
          & ./.github/scripts/Check-EditorConfig.ps1 -Group sod-database -VerboseChecker


      - name: Check Standard database core Lua
