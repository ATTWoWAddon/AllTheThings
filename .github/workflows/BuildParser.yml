name: Build Parser

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
    paths:
      - '.contrib/src/Parser/**'
      - '.github/workflows/BuildParser.yml'
  pull_request:
    paths:
      - '.contrib/src/Parser/**'
      - '.github/workflows/BuildParser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.dotnet.framework }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        dotnet:
          - sdk: '8.0.x'
            framework: net8.0
          - sdk: '9.0.x'
            framework: net9.0
          - sdk: '10.0.x'
            framework: net10.0
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        id: dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet.sdk }}

      - name: Build Parser
        env:
          DOTNET_SDK_VERSION: ${{ steps.dotnet.outputs.dotnet-version }}
          TARGET_FRAMEWORK: ${{ matrix.dotnet.framework }}
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE '.contrib/src/Parser/Parser.csproj'
          $sdkDirectory = Join-Path $env:RUNNER_TEMP 'parser-sdk'
          $outputDirectory = Join-Path $env:RUNNER_TEMP "parser/$env:TARGET_FRAMEWORK"
          New-Item -ItemType Directory -Path $sdkDirectory -Force | Out-Null
          @{ sdk = @{ version = $env:DOTNET_SDK_VERSION; rollForward = 'disable' } } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $sdkDirectory 'global.json')

          Push-Location $sdkDirectory
          try {
            $actualSdk = dotnet --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($actualSdk -ne $env:DOTNET_SDK_VERSION) {
              throw "Expected .NET SDK $env:DOTNET_SDK_VERSION, but selected $actualSdk."
            }
            Write-Host "Building $env:TARGET_FRAMEWORK with .NET SDK $actualSdk"

            $buildProperties = @("-p:TargetFrameworks=$env:TARGET_FRAMEWORK", '-p:Platform=x64', '-p:UseAppHost=false')
            dotnet restore $project @buildProperties --nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet build $project @buildProperties --configuration Release --framework $env:TARGET_FRAMEWORK --no-restore --output $outputDirectory --nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $runtime = Get-Content -LiteralPath (Join-Path $outputDirectory 'Parser.runtimeconfig.json') -Raw | ConvertFrom-Json
            if ($runtime.runtimeOptions.tfm -ne $env:TARGET_FRAMEWORK) {
              throw "Expected output target $env:TARGET_FRAMEWORK, but found $($runtime.runtimeOptions.tfm)."
            }
            Write-Host "Built $($runtime.runtimeOptions.tfm) for $($runtime.runtimeOptions.framework.name) $($runtime.runtimeOptions.framework.version)"
          }
          finally {
            Pop-Location
          }
