name: Issue Flavor Triage

# Initial classification only. Existing or previously removed flavor labels are
# left alone, including after body edits. PTR/Beta are environments, not flavors.
# Manual dispatch runs offline self-tests only and never changes issue labels.
on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Serialize updates for each issue so overlapping events do not race to label it.
concurrency:
  group: issue-flavor-triage-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    if: github.event_name == 'workflow_dispatch' || github.repository == 'ATTWoWAddon/AllTheThings'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # Python and gh are preinstalled on GitHub-hosted runners. No package
      # install, external service, or pull request code execution is required.
      - name: Checkout automation scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Test and classify issue flavor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python3 .github/scripts/issue_flavor_triage.py
          exit $LASTEXITCODE
