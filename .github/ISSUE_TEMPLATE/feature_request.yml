name: Feature Request
description: See something useful that could be added?
labels: ["type:feature"]

body:
  - type: markdown
    attributes:
      value: |
        Please [search existing issues](https://github.com/ATTWoWAddon/AllTheThings/issues) before proposing a feature.
        Contributors will review and discuss requests before deciding on implementation.

  - type: dropdown
    id: flavour
    attributes:
      label: "Which WoW Flavors Does This Proposal Apply To?"
      description: "Select the WoW Flavors the proposed feature would support, including cross-flavor or unsure when appropriate."
      multiple: true
      options:
        - "Retail"
        - "Classic Progression (MoP)"
        - "Classic Era"
        - "Classic Hardcore"
        - "Classic Anniversary (TBC)"
        - "Season of Discovery"
        - "Forever"
        - "All Flavors / Cross-Flavor"
        - "Other / Unsure"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: "WoW Environment"
      description: "Optional: select any environments specifically relevant to the proposal."
      multiple: true
      options:
        - "Live"
        - "PTR"
        - "Beta"

  - type: textarea
    id: problem_description
    attributes:
      label: "What problem are you experiencing that led to this feature request?"
      description: "Describe the use case: what are you trying to do, and what makes it difficult today?"
      placeholder: "Your goal, current workflow, and the problem"
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: "What solution would you like?"
      description: "Describe the proposed behavior and how you would use it. What result would make the feature useful?"
      placeholder: "Proposed solution and the result you expect"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Any alternatives you can think of?"
      description: "Optional: describe alternatives or workarounds you considered and any limitations."
      placeholder: "Describe alternatives here..."

  - type: textarea
    id: additional_context
    attributes:
      label: "Additional Context"
      description: |
        Optional: add examples, screenshots, relevant ATT settings, or special events/modes that help explain the proposal.
        If AI helped with related work or this report, add an `AI Assistance` section with the actual model name(s), what it helped with, and what you verified, per [AGENTS.md](https://github.com/ATTWoWAddon/AllTheThings/blob/master/AGENTS.md).
      placeholder: "Provide additional details here..."
