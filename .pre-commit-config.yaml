repos:
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.6.0
    hooks:
      - id: pyupgrade
        args: ["--py311-plus"]

  - repo: https://github.com/pycqa/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        additional_dependencies: [pep8-naming]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.3.0
    hooks:
      - id: mypy
        args: [--strict]
        additional_dependencies: [aiohttp, types-beautifulsoup4]

  - repo: local
    hooks:
      - id: file-hygiene
        name: Check repository text hygiene
        entry: python .contrib/file-hygiene/check_file_hygiene.py --index
        language: python
        additional_dependencies: [EditorConfig==0.17.1]
        types: [file]
